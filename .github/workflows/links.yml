#
# Weekly check of external links in the docs. It runs on a schedule rather than on
# every pull request, so a flaky third-party site never blocks a merge
# (see skills/docs-tooling/references/testing.md).
name: links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --accept "200..=299,403,429"
            --exclude-path LICENSES
            --exclude-path skills/project-docs/assets
            "./**/*.md"

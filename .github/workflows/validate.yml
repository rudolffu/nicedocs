name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, manifests, attribution, and links
        run: python3 scripts/validate.py
      - name: Smoke-test the installer
        run: |
          tmp="$(mktemp -d)"
          bash scripts/install.sh opencode --project "$tmp"
          test -f "$tmp/.opencode/skills/docs-review/SKILL.md"
          bash scripts/install.sh opencode --project "$tmp" --uninstall
          test ! -e "$tmp/.opencode/skills/docs-review"
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5

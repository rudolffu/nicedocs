name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate skills, manifests, attribution, and links
        run: python3 scripts/validate.py
      - name: Smoke-test the installer
        run: |
          tmp="$(mktemp -d)"
          bash scripts/install.sh opencode --project "$tmp"
          test -f "$tmp/.opencode/skills/docs-review/SKILL.md"
          bash scripts/install.sh opencode --project "$tmp" --uninstall
          test ! -e "$tmp/.opencode/skills/docs-review"
      - name: REUSE compliance
        uses: fsfe/reuse-action@v6

  docs:
    # Same build as Read the Docs (.readthedocs.yaml), with warnings as errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build the docs site
        run: python -m sphinx -T -W --keep-going -b html -c docs . _build/html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      # The Sphinx configuration lives in docs/, but the source is the repository
      # root, so README.md and skills/** build in place with working relative links.
      # -W --keep-going turns warnings into errors (same as fail_on_warning).
      html:
        - python -m sphinx -T -W --keep-going -b html -c docs . $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
